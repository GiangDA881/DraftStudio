[workspace]
resolver = "2"
members = ["crates/core", "apps/cli", "apps/studio"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Nguyễn Xuân Trường Giang <giangninjadracula@gmail.com>"]
repository = "https://github.com/GiangDA881/DraftStudio"

[workspace.dependencies]
capcut-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = "0.4"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
